<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Writing Mood Lamp</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font: 13px ui-monospace, "SFMono-Regular", Consolas, monospace; color: #fff8f1; }
  .lamp {
    position: relative; isolation: isolate; overflow: hidden;
    width: min(100vw, 100dvh); aspect-ratio: 1; margin-inline: auto;
    background: #8d9dc6;
    --base: #8d9dc6; --plum: #b1a0c7; --rose: #ec9d94;
    --amber: #f48f57; --light: #ffd6a0; --haze: 0;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .surface {
    position: absolute; inset: 0; width: 100%; border: 0; overflow: hidden;
    background: linear-gradient(174deg, var(--base), var(--plum) 34%, var(--rose) 68%, var(--amber));
    padding: 0;
  }
  .surface::before, .surface::after {
    content: ""; position: absolute; inset: -37%; pointer-events: none;
    transition: opacity 5s; filter: blur(13px);
  }
  .surface::before {
    background:
      radial-gradient(ellipse 29% 12% at 57% 66%, var(--light), transparent 95%),
      radial-gradient(ellipse 42% 18% at 51% 67%, var(--amber), transparent 92%),
      radial-gradient(ellipse 38% 23% at 51% 59%, var(--rose), transparent 93%),
      radial-gradient(ellipse 42% 25% at 36% 29%, var(--base), transparent 95%);
    animation: drift 32s ease-in-out infinite alternate;
    opacity: calc(1 - var(--haze) * .24);
  }
  .surface::after {
    background:
      radial-gradient(ellipse 38% 16% at 56% 44%, var(--rose), transparent 90%),
      radial-gradient(ellipse 34% 23% at 37% 63%, var(--plum), transparent 93%),
      radial-gradient(ellipse 25% 15% at 65% 65%, var(--light), transparent 96%);
    opacity: calc(.70 - var(--haze) * .3);
    animation: drift 43s ease-in-out infinite alternate-reverse;
    mix-blend-mode: soft-light;
  }
  .lamp[data-phase="dawn"] .surface, .lamp[data-phase="day"] .surface {
    background: radial-gradient(ellipse at 87% 24%, var(--plum), transparent 65%), var(--base);
  }
  .lamp[data-phase="dawn"] .surface::before, .lamp[data-phase="day"] .surface::before {
    background:
      radial-gradient(ellipse 26% 15% at 43% 46%, var(--light), transparent 96%),
      radial-gradient(ellipse 27% 34% at 40% 50%, var(--amber), transparent 96%),
      radial-gradient(ellipse 37% 28% at 43% 53%, var(--rose), transparent 95%);
  }
  .lamp[data-phase="dawn"] .surface::after, .lamp[data-phase="day"] .surface::after {
    background:
      radial-gradient(ellipse 23% 34% at 64% 48%, var(--plum), transparent 92%),
      radial-gradient(ellipse 32% 13% at 53% 65%, var(--rose), transparent 96%);
  }
  .surface[aria-pressed="true"]::before, .surface[aria-pressed="true"]::after {
    animation-play-state: paused;
  }
  @keyframes drift {
    0% { transform: translate(-5%, 6%) rotate(-24deg) scale(1.07); }
    50% { transform: translate(7%, -5%) rotate(5deg) scale(1.19, .92); }
    100% { transform: translate(-2%, -2%) rotate(30deg) scale(1.04, 1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .surface::before, .surface::after { animation: none; }
    .surface::before, .surface::after { transition: none; }
  }
  .surface:focus-visible { outline: 2px solid white; outline-offset: -4px; }
  .edge, .date, .settings {
    font-size: clamp(8px, 3.5vmin, 10px);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .edge {
    position: absolute; inset: auto 0 0; display: flex; justify-content: space-between;
    padding: 16px 12px 10px; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .solar { display: grid; gap: 2px; }
  .solar:last-child { text-align: right; }
  .solar small { font-size: inherit; }
  .heading {
    position: absolute; top: 10px; left: 12px; right: 12px;
    display: grid; justify-items: start; gap: 2px;
    pointer-events: none;
  }
  .settings {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border: 0; background: transparent; padding: 2px 0;
    text-decoration: underline; text-underline-offset: 2px; pointer-events: auto;
  }
  .panel {
    position: absolute; inset: 48px 8px 42px; overflow: auto; padding: 10px;
    border-radius: 10px; background: #332337;
  }
  .panel input { width: 100%; margin: 5px 0; padding: 5px; font: inherit; }
  .panel button { background: transparent; border: 1px solid #a983aa; border-radius: 5px; padding: 4px 6px; }
  .results { display: grid; gap: 4px; margin-top: 6px; }
  .results button { text-align: left; }
  .status { margin: 5px 0; font-size: 11px; }
  .credit { color: inherit; font-size: 10px; }
</style>
<main class="lamp">
  <button class="surface" type="button" aria-label="Pause color motion" aria-pressed="false"></button>
  <div class="heading">
    <time class="date" id="date"></time>
    <button class="settings" type="button" aria-controls="location-panel" aria-expanded="false">Set city</button>
  </div>
  <div class="edge">
    <span class="solar"><small>Sunrise</small><span id="sunrise">—</span></span>
    <span class="solar"><small>Sunset</small><span id="sunset">—</span></span>
  </div>
  <section class="panel" id="location-panel" hidden>
    <form>
      <label for="city">Weather location</label>
      <input id="city" type="search" placeholder="Search city" minlength="2" required>
      <button type="submit">Search</button>
    </form>
    <div class="results"></div>
    <p class="status" role="status"></p>
    <a class="credit" href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo</a>
  </section>
</main>
<script>
  const lamp = document.querySelector('.lamp');
  const surface = document.querySelector('.surface');
  const settings = document.querySelector('.settings');
  const panel = document.querySelector('.panel');
  const cityInput = document.querySelector('#city');
  const status = document.querySelector('.status');
  const results = document.querySelector('.results');
  const sunriseLabel = document.querySelector('#sunrise');
  const sunsetLabel = document.querySelector('#sunset');
  const dateLabel = document.querySelector('#date');
  const storageKey = 'daily-writing-mood-lamp-city';
  const palettes = {
    dawn: ['#638fbc', '#8d91ba', '#dc8b86', '#e28c57', '#f6bc84'],
    day: ['#729bc4', '#9c9fc8', '#e89a8c', '#ed9b64', '#fac691'],
    dusk: ['#8d9dc6', '#b1a0c7', '#ec9d94', '#f48f57', '#ffd6a0'],
    night: ['#7c96bb', '#a49fbc', '#d89d9c', '#e3a07e', '#f7caa5'],
  };
  const colorProperties = ['--base', '--plum', '--rose', '--amber', '--light'];
  let locationChoice;
  let forecast;
  let weatherRequest = 0;
  let citySearch = 0;

  try { locationChoice = JSON.parse(localStorage.getItem(storageKey)); } catch {}

  const params = new URLSearchParams(window.location.search);
  if (params.has('lat') && params.has('lon')) {
    const latitude = Number(params.get('lat'));
    const longitude = Number(params.get('lon'));
    if (params.get('lat').trim() && params.get('lon').trim() &&
        Math.abs(latitude) <= 90 && Math.abs(longitude) <= 180) {
      locationChoice = { latitude, longitude, name: params.get('city') || 'Selected location' };
    }
  }

  function render() {
    const timezone = forecast?.timezone;
    const today = new Date();
    dateLabel.textContent = new Intl.DateTimeFormat('en-US', {
      timeZone: timezone, weekday: 'long', month: 'long', day: 'numeric',
    }).format(today).replace(',', '');
    dateLabel.dateTime = new Intl.DateTimeFormat('sv-SE', {
      timeZone: timezone, year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(today);
    const hour = today.getHours();
    let phase = 'night';
    if (hour >= 5 && hour < 8) phase = 'dawn';
    if (hour >= 8 && hour < 17) phase = 'day';
    if (hour >= 17 && hour < 20) phase = 'dusk';
    let cloudCover = 0;
    sunriseLabel.textContent = '—';
    sunsetLabel.textContent = '—';
    if (forecast) {
      const now = Date.now() / 1000;
      const dateFormatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: forecast.timezone, year: 'numeric', month: '2-digit', day: '2-digit',
      });
      const localDay = dateFormatter.format(today);
      const index = forecast.daily.time.findIndex(day => dateFormatter.format(day * 1000) === localDay);
      const sunrise = forecast.daily.sunrise[index];
      const sunset = forecast.daily.sunset[index];
      const clock = new Intl.DateTimeFormat(undefined, {
        timeZone: forecast.timezone, hour: 'numeric', minute: '2-digit',
      });
      sunriseLabel.textContent = Number.isFinite(sunrise) ? clock.format(sunrise * 1000) : '—';
      sunsetLabel.textContent = Number.isFinite(sunset) ? clock.format(sunset * 1000) : '—';
      phase = forecast.current.is_day ? 'day' : 'night';
      if (Number.isFinite(sunrise) && Math.abs(now - sunrise) < 3600) phase = 'dawn';
      if (Number.isFinite(sunset) && Math.abs(now - sunset) < 4500) phase = 'dusk';
      cloudCover = (forecast.current.cloud_cover ?? 0) / 100;
    }
    if (surface.getAttribute('aria-pressed') === 'true') return;
    lamp.dataset.phase = phase;
    palettes[phase].forEach((color, index) => lamp.style.setProperty(colorProperties[index], color));
    lamp.style.setProperty('--haze', cloudCover);
  }

  async function getJson(url) {
    const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('Request failed');
    return response.json();
  }

  async function loadWeather() {
    if (!locationChoice) return;
    const request = ++weatherRequest;
    const { latitude, longitude, name } = locationChoice;
    const query = new URLSearchParams({
      latitude, longitude, current: 'cloud_cover,is_day', daily: 'sunrise,sunset',
      timezone: 'auto', forecast_days: 2, timeformat: 'unixtime',
    });
    const cityName = name.split(',')[0].trim();
    settings.textContent = cityName;
    settings.setAttribute('aria-label', 'Change weather location: ' + cityName);
    status.textContent = 'Loading weather…';
    try {
      const data = await getJson('https://api.open-meteo.com/v1/forecast?' + query);
      if (request !== weatherRequest) return;
      forecast = data;
      status.textContent = name;
      render();
    } catch {
      if (request !== weatherRequest) return;
      status.textContent = 'Weather unavailable. Choose a city to retry.';
    }
  }

  function toggleSettings(open) {
    settings.setAttribute('aria-expanded', String(open));
    panel.hidden = !open;
    if (open) cityInput.focus();
    else settings.focus();
  }

  settings.addEventListener('click', () => toggleSettings(panel.hidden));
  panel.addEventListener('keydown', event => {
    if (event.key === 'Escape') toggleSettings(false);
  });
  surface.addEventListener('click', () => {
    const paused = surface.getAttribute('aria-pressed') === 'true';
    surface.setAttribute('aria-pressed', String(!paused));
    surface.setAttribute('aria-label', paused ? 'Pause color motion' : 'Resume color motion');
    if (paused) render();
  });

  panel.querySelector('form').addEventListener('submit', async event => {
    event.preventDefault();
    const request = ++citySearch;
    results.replaceChildren();
    status.textContent = 'Searching…';
    const query = new URLSearchParams({ name: cityInput.value.trim(), count: 5, language: 'en' });
    try {
      const data = await getJson('https://geocoding-api.open-meteo.com/v1/search?' + query);
      if (request !== citySearch) return;
      status.textContent = data.results?.length ? '' : 'No matching cities.';
      for (const city of data.results ?? []) {
        const option = document.createElement('button');
        option.type = 'button';
        option.textContent = [...new Set([city.name, city.admin1, city.country].filter(Boolean))].join(', ');
        option.addEventListener('click', () => {
          locationChoice = { latitude: city.latitude, longitude: city.longitude, name: city.name };
          try { localStorage.setItem(storageKey, JSON.stringify(locationChoice)); } catch {}
          if (params.has('lat') || params.has('lon')) {
            params.set('lat', city.latitude);
            params.set('lon', city.longitude);
            params.set('city', city.name);
            history.replaceState(null, '', '?' + params);
          }
          forecast = null;
          results.replaceChildren();
          render();
          loadWeather();
          toggleSettings(false);
        });
        results.append(option);
      }
    } catch {
      if (request === citySearch) status.textContent = 'City search unavailable. Try again.';
    }
  });

  render();
  loadWeather();
  setInterval(render, 60000);
  setInterval(loadWeather, 30 * 60000);
</script>
</html>
